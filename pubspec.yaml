name: jadwal_harian
description: Aplikasi personal untuk melacak kedisiplinan menjalankan jadwal harian.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  # Dipin persis ke 2.3.3+1: sqflite_android 2.4.x pindah ke jembatan JNI
  # (libdartjni.so) yang gagal dimuat di banyak perangkat/emulator
  # ("Failed to load dynamic library ... libdartjni.so"). Versi ini masih
  # memakai implementasi Android lama yang stabil.
  sqflite: 2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  # Font ikon Lucide ikut dibundel sebagai aset paket (assets/lucide.ttf),
  # tidak diambil dari CDN saat aplikasi berjalan.
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
