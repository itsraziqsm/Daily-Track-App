name: jadwal_harian
description: Aplikasi personal untuk melacak kedisiplinan menjalankan jadwal harian.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  # Dipin persis ke 2.3.3+1: sqflite_android 2.4.x pindah ke jembatan JNI
  # (libdartjni.so) yang gagal dimuat di banyak perangkat/emulator
  # ("Failed to load dynamic library ... libdartjni.so"). Versi ini masih
  # memakai implementasi Android lama yang stabil.
  sqflite: 2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  # Font ikon Lucide ikut dibundel sebagai aset paket (assets/lucide.ttf),
  # tidak diambil dari CDN saat aplikasi berjalan.
  lucide_icons_flutter: ^3.1.20
  # Notifikasi lokal terjadwal + zona waktu untuk penjadwalannya.
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Semua font dibundel sebagai aset (SIL OFL 1.1, lihat assets/fonts/NOTICE.md);
  # tidak ada pengambilan font dari CDN saat aplikasi berjalan.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
        - asset: assets/fonts/Onest-ExtraBold.ttf
          weight: 800
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
